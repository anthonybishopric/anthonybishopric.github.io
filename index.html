<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <canvas id="clockCanvas" width="300" height="300" style="background: #fff; border-radius: 50%; box-shadow: 0 0 16px #aaa;"></canvas>
    </div>
  </div>
</div>
<script>
(function(){
  const canvas = document.getElementById('clockCanvas');
  const ctx = canvas.getContext('2d');
  const radius = canvas.width / 2;
  ctx.translate(radius, radius);

  function drawClock() {
    ctx.clearRect(-radius, -radius, canvas.width, canvas.height);

    // Draw face
    ctx.beginPath();
    ctx.arc(0, 0, radius - 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#fafafa';
    ctx.fill();

    // Draw hour marks (dashes)
    for(let i = 0; i < 12; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI / 6);
      ctx.beginPath();
      ctx.moveTo(0, -radius + 15);
      ctx.lineTo(0, -radius + 30);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#333";
      ctx.stroke();
      ctx.restore();
    }

    // Draw minute marks (binary-coded, light blue if bit is 1)
    const unixTime = Math.floor(Date.now() / 1000);
    for(let i = 0; i < 60; i++) {
      if(i % 5 === 0) continue; // skip hour marks
      ctx.save();
      ctx.rotate(i * Math.PI / 30);
      ctx.beginPath();
      ctx.moveTo(0, -radius + 20);
      ctx.lineTo(0, -radius + 28);
      ctx.lineWidth = 1.5;
      // Bitwise check: light blue if bit is 1, else #bbb
      ctx.strokeStyle = ((unixTime >> i) & 1) ? "#61bfff" : "#bbb";
      ctx.stroke();
      ctx.restore();
    }

    const now = new Date();
    const hours = now.getHours() % 12;
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const ms = now.getMilliseconds();

    // Draw hour hand
    ctx.save();
    ctx.rotate(
      (hours + minutes / 60) * Math.PI / 6
    );
    ctx.beginPath();
    ctx.moveTo(0, 10);
    ctx.lineTo(0, -radius + 80);
    ctx.lineWidth = 7;
    ctx.strokeStyle = "#333";
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();

    // Draw minute hand
    ctx.save();
    ctx.rotate(
      (minutes + seconds / 60) * Math.PI / 30
    );
    ctx.beginPath();
    ctx.moveTo(0, 18);
    ctx.lineTo(0, -radius + 48);
    ctx.lineWidth = 4;
    ctx.strokeStyle = "#555";
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();

    // Draw second hand
    ctx.save();
    ctx.rotate(
      (seconds + ms / 1000) * Math.PI / 30
    );
    ctx.beginPath();
    ctx.moveTo(0, 28);
    ctx.lineTo(0, -radius + 34);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#c23535";
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.restore();

    // Center dot
    ctx.beginPath();
    ctx.arc(0, 0, 7, 0, 2 * Math.PI);
    ctx.fillStyle = "#c23535";
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, 2 * Math.PI);
    ctx.fillStyle = "#fff";
    ctx.fill();
  }

  function animate() {
    drawClock();
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
